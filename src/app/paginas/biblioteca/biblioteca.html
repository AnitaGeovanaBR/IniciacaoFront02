<div class="bibliotecapagina">
  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 style="color: #660505;">Listagem de Bibliotecas
        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-book-half" viewBox="0 0 16 16">
          <path d="M8.5 2.687c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783"/>
        </svg>
      </h2>
      <button class="btn btn-success" [routerLink]="['/biblioteca/novo']">
         Adicionar biblioteca
      </button>
    </div>

    <table class="table table-striped table-hover shadow-sm bg-white">
      <thead class="table-dark">
        <tr>
          <th scope="col">ID (Guid)</th>
          <th scope="col">Nome da Biblioteca</th>
          <th scope="col" class="text-center">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let b of listaBibliotecas">
          <td style="font-size: 0.8rem; color: #666;">{{ b.idBiblioteca }}</td>
          <td class="fw-bold">{{ b.nome }}</td>
          <td class="text-center">
            <a [routerLink]="['/biblioteca/visualizar', b.idBiblioteca]" class="btn btn-info btn-sm me-2 text-white">
              <i class="bi bi-eye"></i> Visualizar
            </a>
          
            <a [routerLink]="['/biblioteca/editar', b.idBiblioteca]" class="btn btn-warning btn-sm me-2 text-white">
              <i class="bi bi-pencil"></i> Editar
            </a>
          
            <button (click)="excluirBiblioteca(b.idBiblioteca!)" class="btn btn-danger btn-sm">
              <i class="bi bi-trash"></i> Excluir
            </button>
          </td>
        </tr>
        
       <tr *ngFor="let b of listaBibliotecas">
          <td style="font-size: 0.8rem; color: #666;">{{ b.idBiblioteca }}</td>
          <td class="fw-bold">{{ b.nome }}</td>
       </tr>
      </tbody>

    </table>
  </div>
</div>
