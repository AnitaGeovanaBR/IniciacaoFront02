<div class="bibliotecapagina">
  <div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="text-white">
        Listagem de Bibliotecas
      </h2>

      <button class="btn btn-success" [routerLink]="['/biblioteca/novo']">
        Adicionar biblioteca
      </button>
    </div>

    @if (listaBibliotecas.length === 0) {
      <div class="text-center text-white mt-5">
        <div class="spinner-border text-warning" role="status"></div>
        <p class="mt-3">Carregando bibliotecas...</p>
      </div>
    }

    @if (listaBibliotecas.length > 0) {
      <table class="table table-striped table-hover shadow-sm bg-white">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>

        <tbody>
          @for (b of listaBibliotecas; track b.idBiblioteca) {
            <tr>
              <td class="text-muted" style="font-size: 0.8rem;">
                {{ b.idBiblioteca }}
              </td>

              <td class="fw-bold">
                {{ b.nome }}
              </td>

              <td class="text-center">
                <a
                  [routerLink]="['/biblioteca/visualizar', b.idBiblioteca]"
                  class="btn btn-info btn-sm me-2 text-white"
                >
                  Visualizar
                </a>

                <a
                  [routerLink]="['/biblioteca/editar', b.idBiblioteca]"
                  class="btn btn-warning btn-sm me-2 text-white"
                >
                  Editar
                </a>

                <button
                  class="btn btn-danger btn-sm"
                  (click)="excluirBiblioteca(b.idBiblioteca)"
                >
                  Excluir
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    }

  </div>
</div>
