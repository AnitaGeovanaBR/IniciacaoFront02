<div class="container mt-5">
  <div class="card shadow border-warning">
    <div class="card-header bg-warning text-dark">
      <h3 class="mb-0">Editar Cadastro: Biblioteca</h3>
    </div>
    <div class="card-body">
      <form #formEditar="ngForm">
        <div class="mb-4">
          <label for="nome" class="form-label fw-bold">Nome da Unidade:</label>
          <input type="text" 
                 class="form-control form-control-lg" 
                 id="nome" 
                 name="nome"
                 [(ngModel)]="nomeBiblioteca" 
                 required>
          <small class="text-muted">Altere o nome acima e clique em salvar para confirmar.</small>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-secondary" [routerLink]="['/biblioteca']">
            Cancelar
          </button>
          <button type="button" class="btn btn-success px-4" (click)="salvarEdicao()">
            Salvar Alterações
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
