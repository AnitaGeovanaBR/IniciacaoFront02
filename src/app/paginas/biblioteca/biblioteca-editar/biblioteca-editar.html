<div class="container mt-5">
  @if (nomeBibliotecaOriginal) {
    <div class="card shadow border-warning">
      <header class="card-header bg-warning text-dark">
        <h3 class="mb-0">
          Editar Biblioteca: <strong>{{ nomeBibliotecaOriginal }}</strong>
        </h3>
      </header>

      <div class="card-body">
        <form #formEditar="ngForm" (ngSubmit)="salvarEdicao()" novalidate>
          <div class="mb-4">
            <label for="nome" class="form-label fw-bold">Novo nome da unidade</label>
            <input
              id="nome"
              name="nome"
              type="text"
              class="form-control form-control-lg"
              [(ngModel)]="nomeBiblioteca"
              required
              minlength="3"
            />
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a class="btn btn-outline-secondary" routerLink="/biblioteca">Cancelar</a>
            <button type="submit" class="btn btn-success px-4" [disabled]="formEditar.invalid">
              Salvar Alterações
            </button>
          </div>
        </form>
      </div>
    </div>
  } @else {
    <div class="text-center mt-5">
      <div class="spinner-border text-warning" role="status"></div>
      <p>Carregando dados da biblioteca...</p>
    </div>
  }
</div>
