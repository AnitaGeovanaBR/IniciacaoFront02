<div class="container mt-5">
  <h2>Cadastrar Nova Biblioteca</h2>
  <form (ngSubmit)="salvar()">
    <div class="mb-3">
      <label class="form-label">Nome da Biblioteca</label>
      <input type="text" class="form-control" [(ngModel)]="novaBiblioteca.nome" name="nome" required>
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
    <button type="button" class="btn btn-secondary ms-2" routerLink="/biblioteca">Cancelar</button>
  </form>
</div>
