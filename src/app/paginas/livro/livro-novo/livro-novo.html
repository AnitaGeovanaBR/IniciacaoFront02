<div class="container mt-5">
  <div class="card shadow border-primary">
    <header class="card-header bg-primary text-white text-center">
      <h3 class="mb-0">Cadastrar Novo Livro</h3>
    </header>

    <div class="card-body">
      <form #formNovo="ngForm" (ngSubmit)="salvar()" novalidate>
        <div class="row">
          <div class="col-md-12 mb-3">
            <label class="form-label fw-bold">Nome do Livro</label>
            <input type="text" class="form-control" [(ngModel)]="novoLivro.nome" name="nome" required minlength="3">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Autor</label>
            <input type="text" class="form-control" [(ngModel)]="novoLivro.autor" name="autor" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Edição</label>
            <input type="text" class="form-control" [(ngModel)]="novoLivro.edicao" name="edicao">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Editora</label>
            <input type="text" class="form-control" [(ngModel)]="novoLivro.editora" name="editora">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">ISBN</label>
            <input type="text" class="form-control" [(ngModel)]="novoLivro.isbn" name="isbn">
          </div>

          <div class="col-md-12 mb-3">
            <label class="form-label fw-bold">Descrição</label>
            <textarea class="form-control" rows="3" [(ngModel)]="novoLivro.descricao" name="descricao"></textarea>
          </div>

          <div class="col-md-6 mb-4">
            <label class="form-label fw-bold">Data de Publicação</label>
            <input type="date" class="form-control" [(ngModel)]="novoLivro.dataPublicacao" name="dataPublicacao" required>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 border-top pt-3">
          <button type="button" class="btn btn-outline-secondary" routerLink="/livro">Cancelar</button>
          <button type="submit" class="btn btn-primary px-4" [disabled]="formNovo.invalid">
            Salvar Livro
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
